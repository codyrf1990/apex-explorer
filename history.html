<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apex Explorer — Files</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <header class="bar">
    <h1>Apex Explorer</h1>
    <div class="actions">
      <button id="exportCsv">Export CSV</button>
    </div>
  </header>

  <section id="folderBar" class="folder-bar">
    <button id="folderBtn" class="folder-btn">Select Folder</button>
    <span id="folderPath" class="folder-path"></span>
  </section>

  <section class="filters">
    <input id="search" type="text" placeholder="Search filename, customer, type, number">
    <select id="sort">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="name">Name (A-Z)</option>
      <option value="customer">Customer (A-Z)</option>
    </select>
  </section>

  <section class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Modified</th>
          <th>Filename</th>
          <th>Customer</th>
          <th>Type</th>
          <th>#</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty">Select a folder to view files.</div>
  </section>

  <script type="module" src="history.js"></script>
</body>
</html>
